[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharpa-interface"
version = "0.3.0"
description = "SharpA policy server dict interface"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dfm_serving = ["aiohttp>=3.9", "Pillow>=10", "msgpack>=1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sharpa_interface*"]
