<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Train Mask Annotator</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">TRAIN MASK ANNOTATOR</p>
          <h1>动作屏蔽区间标注</h1>
          <p id="episodePath" class="path">正在加载…</p>
        </div>
        <div class="legend">
          <span><i class="green"></i>参与训练</span>
          <span><i class="red"></i>不参与训练</span>
        </div>
      </header>

      <section class="videos">
        <article class="video-card ego-card">
          <div class="video-label">EGO</div>
          <video id="video-ego" muted playsinline preload="auto"></video>
        </article>
        <article class="video-card">
          <div class="video-label">LEFT WRIST</div>
          <video id="video-left_wrist" muted playsinline preload="auto"></video>
        </article>
        <article class="video-card">
          <div class="video-label">RIGHT WRIST</div>
          <video id="video-right_wrist" muted playsinline preload="auto"></video>
        </article>
      </section>

      <section class="workspace">
        <div class="transport">
          <button id="playButton" class="primary">▶ 播放</button>
          <button id="backFrame">−1 帧</button>
          <button id="forwardFrame">+1 帧</button>
          <label>
            速度
            <select id="speed">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
          </label>
          <output id="position">帧 0 · 0.000 s</output>
        </div>

        <input id="scrubber" type="range" min="0" max="1" value="0" step="1" />

        <div class="timeline-wrap">
          <canvas id="timeline" height="44"></canvas>
        </div>

        <div class="annotation-controls">
          <button id="markStart" class="danger">[ 标记错误动作开始</button>
          <button id="markEnd" class="danger-outline">] 标记有效恢复开始</button>
          <button id="cancelPending">取消当前起点</button>
          <button id="saveButton" class="save">保存 train_mask</button>
        </div>

        <p id="hint" class="hint">
          快捷键：Space 播放/暂停，←/→ 单帧，Shift+←/→ 一秒，[ 错误开始，] 恢复开始，Ctrl+S 保存。
        </p>
        <p id="status" class="status">准备中…</p>
      </section>

      <section class="ranges-panel">
        <div class="panel-heading">
          <h2>已屏蔽区间</h2>
          <p id="summary">0 帧被屏蔽</p>
        </div>
        <div id="emptyRanges" class="empty">还没有红色区间。</div>
        <table id="rangesTable" hidden>
          <thead>
            <tr><th>#</th><th>错误开始</th><th>恢复开始</th><th>长度</th><th></th></tr>
          </thead>
          <tbody id="rangesBody"></tbody>
        </table>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
